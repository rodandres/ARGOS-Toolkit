[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-toolkit"
version = "0.1.0"
description = "ARGOS - Aerospace Research for GNC Operational Scenarios toolkit"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "psutil>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]